      `hasDerivAt_gaussExp`（"指数前因子在求导下保持"）。声明在顶层 `namespace OS4`。
      剩余（**未**登记，故本节点不覆盖）= 一般 `k` 归纳 + 参数积分求导 + 径向界 + `thm:os4` 组装。

  GJ_1841_FOREST_BOUND:
    modules: [S6Isserlis.GJ1841]
    theorem_names:
      - GJ1841.card_vert_sub_card_connectedComponent_le_card_edgeSet
      - GJ1841.IsAcyclic.card_vert_le_card_edgeSet_add_card_connectedComponent
    note: >-
      Glimm–Jaffe 2nd ed `(18.4.1)` 的 **L1（森林界）**：有限图 `#V − #连通分量 ≤ #E`，无圈情形
      **取等**。**纯图论**（与 P(φ)₂ 的具体几何无关）、**Mathlib-only**（`requires` 闭包为空）。
      ⚠️ 陈述层坑（已实测）：`Fintype.card G.ConnectedComponent` **不能**只从 `[Fintype V]` 推出
      —— 商类型的 `Fintype` 实例要求 `DecidableRel G.Adj` + `DecidableEq V`，只在
      `open scoped Classical` 下 elaboration；文件顶部已开，**陈述未削弱**。
      **不**代表 `PPHI2_ACTIVITY_BOUND`（核 B）已闭合 —— `(18.7.A)` 的合并记账仍 OPEN。
      L2（角引理）/ L3（分量数上界）/ 装配 T 与单位方块模型已由 `GJ_1841_ASSEMBLY` 覆盖
      （2026-10-12；见 `formal/lean/M2_keystone18_plan.md` §6–§7）。

  GJ_1841_ASSEMBLY:
    modules: [S6Isserlis.BlockModel, S6Isserlis.GJ1841Block]
    theorem_names:
      - Pphi2Block.glueGraph_reachable_iff_sqGraph_reachable
      - Pphi2Block.card_linesIn_eq_card_edgeSet
      - Pphi2Block.sqGraph_reachable_of_glue_component
      - Pphi2Block.card_connectedComponent_le_card_of_meets
      - Pphi2Block.card_sub_one_le_two_mul_card
      - Pphi2Block.gj_1841
      - Pphi2Block.gj_1841_enhanced
    note: >-
      Glimm–Jaffe 2nd ed `(18.4.1)` 的 **L2（角引理）+ L3（分量数上界）+ 装配 T** —— M2 组合层第二/三块。
      `BlockModel.lean` 给**单位方格模型**（`Sq := ℤ×ℤ`、`Line := ℤ×ℤ×Bool`、`cornerSquares`/`cornerLines`、
      `sqGraph`/`glueGraph`）与 **L2**：在 (ii) `Γ ⊆ Int X` 下 `glueGraph` 与 `sqGraph` **同可达关系**
      （角引理 §1.3(a) 的组合内核；角步由"该角四线全在 `Γ` 内"给出，由 (ii) 该角四方格全在 `X` 内，
      于是它们在方格图中构成四圈）。`GJ1841Block.lean` 给 **L3**（分量数 `≤ |X₀|`）与**装配**
      `|X| − n ≤ |Γ|`；书中形式 `|X| − n ≤ 2|Γ|` 由 `card_sub_one_le_two_mul_card` 给出。
      Mathlib-only（唯一 `requires` 是 L1 那块 `GJ_1841_FOREST_BOUND`）。
      ⚠️ **模型口径**：`glueGraph` **是**（而非**证明等于**）"`X∖Γ^c` 连通分量"的组合模型 ——
      §1.3(b) 的 **ℝ² 拓扑**未形式化（`M2_keystone18_plan.md` §6 选项 (b) 的登记项）。
      ⚠️ **不**表示 `PPHI2_ACTIVITY_BOUND`（核 B）已闭合 —— `(18.7.A)` 的合并记账仍 OPEN；
      书的 §1.6「取等」亦未形式化。

