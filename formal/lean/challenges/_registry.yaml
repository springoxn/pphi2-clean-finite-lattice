      定理 3.3（树图界）**都不在本契约内**；因此它**不**使 `PPHI2_CE_URSELL` 达到 `FORMALIZED`
      （见 `unwired` 登记与节点 `description`）。

  PPHI2_WICK_FINITE_DIM:
    modules: [S6Isserlis.Wick, S6Isserlis.HermiteDeriv, S6Isserlis.WickBridge]
    theorem_names:
      - Wick.wick_zero
      - Wick.wick_one
      - Wick.wick_add_two
      - Wick.wick_two
      - Wick.wick_three
      - Wick.wick_four
      - Wick.natDegree_wick_le
      - Polynomial.derivative_hermite
      - WickBridge.wick_eq_hermite
    note: >-
      有限维 Wick 幂 `:X^n:` 的代数核（**项目自写 Lean**，Mathlib-only，`requires = []`）——
      PPHI2 的 Wick 序（`PPHI2_WICK_ORDERING`）的有限维/定义层，2026-10-15 调查时发现
      `Wick.lean` / `HermiteDeriv.lean` / `WickBridge.lean` **既不在任何 challenge，也不被任何节点
      evidence 提及**（图中零出现），故补登记为独立节点。
      `Wick.wick c n` = 相对方差 `c` 的 Wick 幂，由 Hermite 递推定义（`wick_add_two`），
      显式读数 `wick_zero`/`wick_one`/`wick_two`/`wick_three`/`wick_four` + 次数界 `natDegree_wick_le`；
      `Polynomial.derivative_hermite` 补 **Mathlib 缺口**（概率论 Hermite `He_{n+1}` 的导数三项递推，
      Mathlib 只给定义式不给该形式）；`WickBridge.wick_eq_hermite` 是 Wick 幂到 Mathlib Hermite 的桥
      `wick (s²) n = C (sⁿ) · (H n).comp (qs s)`（`s ≠ 0`）。
      ⚠️ **诚实边界**：Wick **正交性** `E[:X^n: :X^m:] = δ_nm n! c^n`、单混沌超压缩
      （`‖He_n‖_p ≤ (p−1)^{n/2}√(n!)`）与**无限维** Wick 幂**都不在本契约内**
      （见 `formal/lean/pphi2_formalization_plan.md` §3 的 L0-2/L0-3 待做项）；
      因此它**不**使 `PPHI2_WICK_ORDERING` 达到 `FORMALIZED`（后者的注册陈述含二维 UV 有限性）。

  PPHI2_NELSON_LAYERCAKE:
    modules: [S6Isserlis.NelsonLayerCake]
    theorem_names:
      - Pphi2Nelson.integral_exp_mul_Ioc
      - Pphi2Nelson.lintegral_exp_Ioc
      - Pphi2Nelson.exp_neg_le_layercake
      - Pphi2Nelson.lintegral_exp_neg_le
      - Pphi2Nelson.lintegral_exp_neg_le_split
    note: >-
      Nelson (V) 的**层饼引擎**（**项目自写 Lean**，Mathlib-only，`requires = []`）——
      2026-10-15 调查时发现 `NelsonLayerCake.lean` **既不在任何 challenge，也不被任何节点
      evidence 提及**（图中零出现），故补登记为独立节点。
      内容 = paper `proofs/pphi2_nelson_dynamical_cutoff.md` **引理 6.1** 的抽象测度论内核：
      `integral_exp_mul_Ioc`（`∫_0^b q e^{qM} dM = e^{qb} − 1`，FTC）与 `lintegral_exp_Ioc`（其 `ℝ≥0∞` 版）、
      **`exp_neg_le_layercake`**（逐点 `e^{−qx} ≤ 1 + ∫⁻_0^∞ q e^{qM}·1_{M≤−x} dM`）、
      **`lintegral_exp_neg_le`**（= 引理 6.1：`∫⁻ e^{−qV} dμ ≤ 1 + ∫⁻_0^∞ q e^{qM} μ{V≤−M} dM`）、
      **`lintegral_exp_neg_le_split`**（= 引理 4.10 的 `t₀`-劈裂抽象形）。
      ⚠️ **诚实边界（重要）**：**引擎本身正确且可复用**（任何层饼型估计都用它），但
      paper **引理 4.10 的结论已被数值证伪**（`verify/pphi2_layercake_asymptotics_probe.py`：
      大 `M` 段 `~ e^{Θ(|Λ|log²|Λ|)}`，见 `PPHI2_NELSON_VOLUME` 的 evidence 与
      `proof_graph/reviews/pphi2_nelson_volume_review.md` §5–§6）。
      故本契约只冻结**三条不等式**，**不**主张 (V)、也**不**使 `PPHI2_NELSON_VOLUME` 达到 `FORMALIZED`。

