# 陈述-挑战注册表（statement-challenge registry）
#
# 为什么需要这个文件：`theory_graph.yaml` 的 `evidence[].ref` 是**自由文本**
# （例如 "formal/lean/s6/S1_final.lean（…）"），因此「节点 → Lean 模块/定理」
# 这条链接目前**没有机器可读的来源**。本注册表补上这一段，是陈述-挑战协议的输入。
#
# 维护规则
#   * 只登记 `lean_provenance: self` 的形式化（`imported:` 的上游形式化由上游负责，
#     本表只记 provenance 与出处，不参与本地检查）。
#   * `theorem_names` 必须是**全限定名**。
#   * 本地契约的 `modules` 必须在 `S6Isserlis_root.lean` 里；`remote_only: true` 的契约显式
#     指定独立 Lake 项目与远端路径，不属于主 S6 本地构建，`--run` 必须显示 SKIP。
#   * 改陈述 ⇒ `statement_sha256` 必然变红；这是**故意的**，要用
#     `python tools/lean_challenge.py --update-hashes --why "..."` 显式接受。
#   * `unwired:` 段登记「契约为真、但图上无 requires 消费方」的自证节点（每条须带 reason）；
#     判据见 `verify/formalization_contract_probe.py`（C3），现场读数见
#     `python tools/formalization_audit.py`。
version: 1
permitted_axioms: [propext, Classical.choice, Quot.sound]

challenges:
  PPHI2_FIXED_VOLUME_COVARIANCE_LIMIT:
    modules: [AImathPPhi2Clean.PeriodicFourierCovarianceLimit]
    theorem_names:
      - Pphi2Clean.Continuum.fixedVolumeCovarianceInner_tendsto_torusFourierGreenPairing
      - Pphi2Clean.Continuum.physicalGJMeasure_fixedVolume_mixedMoment_tendsto_torusFourierGreenPairing
      - Pphi2Clean.Continuum.physicalGJMeasure_fixedVolume_covariance_tendsto_torusFourierGreenPairing
    remote_only: true
    project: /home/zhengyj/AImath-lean/AImathPPhi2Clean
    note: >-
      This contract targets the separate AImathPPhi2Clean Lake project, not the
      S6Isserlis root build. The authoritative source is formal/lean/s6/pphi2_clean;
      verify by SSH on the declared project. Local lean_challenge runs explicitly
      report SKIP for this contract rather than treating it as a local pass.

  PPHI2_FIXED_VOLUME_FREE_FIELD_MEASURE_LIMIT:
    modules:
      - AImathPPhi2Clean.PeriodicHMinusThreeTopologyBorel
      - AImathPPhi2Clean.PeriodicHMinusThreeWeakLimitMarginal
    theorem_names:
      - Pphi2Clean.Continuum.periodicHMinusThreeCompletion_separable
      - Pphi2Clean.Continuum.periodicHMinusThree_probabilityMeasure_ext_of_indexed_cylinder_marginals
      - Pphi2Clean.Continuum.periodicHMinusThree_fixedVolume_subsequential_limit_has_expected_cylinder
      - Pphi2Clean.Continuum.periodicHMinusThree_fixedVolume_weak_limit_exists
      - Pphi2Clean.Continuum.periodicHMinusThree_fixedVolume_weak_limit_has_expected_cylinder
      - Pphi2Clean.Continuum.periodicHMinusThree_fixedVolume_weak_limit_unique
      - Pphi2Clean.Continuum.periodicHMinusThree_fixedVolume_weak_limit_exists_with_expected_cylinders
    remote_only: true
    project: /home/zhengyj/AImath-lean/AImathPPhi2Clean
    note: >-
      This contract targets the separate AImathPPhi2Clean Lake project, not the
      S6Isserlis root build. It records concrete separability, finite-cylinder
      identification, and the whole-sequence weak-limit existence theorem. The
      candidate free measure is constructed as a Prokhorov subsequential limit
      and characterized by its finite Fourier marginals.

  S1_DISTRIBUTION_IDENTIFICATION:
    modules: [S6Isserlis.S1_final]
    theorem_names:
      - S6Isserlis.s1_distribution_identity
      - S6Isserlis.s1_q_growth
    note: >-
      S1 分布恒等式 ∫ c_m(x)φ(x)dx = ⟨𝓕⁻[q],φ⟩。红线核对点：不得回灌 S6 green_identity
      （`hq` 无假设泄漏）；陈述冻结后任何"顺手加强"都会变红。

  S3_GREEN_DISTRIBUTION:
    modules: [S6Isserlis.S3]
    theorem_names:
      - S6Isserlis.green_identity
    note: >-
      在 𝓢′(V,ℂ) 上证明 (Δ−m²)G = −δ₀。`hq` 前提 = 乘子 q 的 HasTemperateGrowth。

  GFF_COV_SYMMETRIC:
    modules: [S6Isserlis.S4]
    theorem_names:
      - Schwinger.s4_symmetric
    note: >-
      两点函数的交换对称（S 拓扑下的登记）。
      注意：`S4.lean` 的声明在**顶层** `namespace Schwinger` 里，不是 `S6Isserlis.*`
      —— 证据散文里写的是"AImath S4.lean"，从散文推不出全限定名，这正是本注册表要
      消掉的歧义。

  OS1_FREE_SCALAR:
    modules: [S6Isserlis.OS1]
    theorem_names:
      - OS1.integral_weighted_square_nonneg
      - OS1.os1_quad_factorization
      - OS1.os1_reflection_positive
      - OS1.os1_gram_positive
      - OS1.schwinger_param_rep
    note: >-
      OS1 反射正性（有限因子核 + 分析层 + Schwinger 参数表示）。
      注意：模块名是 `S6Isserlis.OS1`，但声明在 `namespace OS1`（顶层）。
      **本条的机器价值**：OS1.lean 里有 3 条 `axiom` 声明，历来靠人工断言"是死声明、
      未被任何定理使用"。公理足迹检查把这句话变成**可核验**的：只要
      `#print axioms` 对这 5 条定理只返回 kernel trio，死声明即为机器证实。

  WICK_FINITE_DIM_GAUSS_WICK:
    modules: [S6Isserlis.S7, S6Isserlis.S8, S6Isserlis.S11, S6Isserlis.S12]
    theorem_names:
      - Schwinger.polarization
      - Schwinger.eq_of_diagonal_eq
      - Schwinger.card_matchings_two_mul
      - Schwinger.pairingML_isSymm
      - Schwinger.gauss_wick
    note: >-
      有限维 Gauss–Wick（全 n）的代数核心，四项各一条链：极化恒等式（S7）→ 配对计数
      `#(matchings 2k) = (2k-1)!!`（S8，双射组装）→ 配对型的对称 `MultilinearMap`（S11）→
      矩恒等式 `E[∏Xᵢ] = Σ_匹配 ∏Σ`（S12）。**`requires` 闭包为空**（只用 Mathlib）——这是本项目
      第一批"足迹 = 标准三条、且无项目内前提"的形式化链。⚠️ 四个模块的声明都在**顶层
      `namespace Schwinger`**，故全限定名**不是** `S6Isserlis.*`（与 `GFF_COV_SYMMETRIC`
      同款陷阱：散文写"AImath S7.lean"推不出全限定名，这正是本注册表要消掉的歧义）。

  OS3_CONVOLUTION_DECAY:
    modules: [S6Isserlis.S9]
    theorem_names:
      - OS3.conv_decay
      - OS3.div_two_rpow_neg
    note: >-
      论文 `lem:conv` 的分布层机械化：多项式衰减函数的卷积仍多项式衰减（一般 Haar 测度版）。
      声明在顶层 `namespace OS3`。⚠️ Mathlib v4.34 对一般赋范空间 `E` 的 `volume` **没有**
      `IsAddHaarMeasure` 实例，故 μ 抽为**显式测度参数**（对 `EuclideanSpace ℝ (Fin d)` + `volume`
      实例齐全）——这是口径上的一处**弱化**，不是等价改写。剩余 = `lem:decay`/`lem:averaged`/
      `thm:cluster`/`thm:ergodic`。

